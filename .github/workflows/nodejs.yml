name: Node CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - "feature/*"
      - "maintain/*"
      - "shinyoshiaki/*"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
      - name: init submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get -y install libavdevice-dev libavfilter-dev libopus-dev libvpx-dev pkg-config libsrtp2-dev libasound2-dev libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-pulseaudio
          npm i
          cd e2e
          npm i
          cd ../
          npm run install:browsers
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3    
      - name: test
        env:
          CI: true
        run: |
          npm run ci

  dtls13-boringssl:
    name: DTLS 1.3 BoringSSL interop (P0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install deps
        run: npm i
      - name: Fetch pinned BoringSSL + build dtls13_echo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ git pkg-config
          cd packages/dtls/tests/e2e/boringssl
          chmod +x ./fetch-and-build-boringssl.sh ./build-bssl-echo.sh
          # Always build from BORINGSSL_REVISION pin (reproducible; no preinstalled lib dependency)
          ./fetch-and-build-boringssl.sh
          test -x ./dtls13_echo
          test -f ./.built-revision
          PIN=$(tr -d '[:space:]' < ../../../tools/boringssl-dtls13/BORINGSSL_REVISION)
          BUILT=$(tr -d '[:space:]' < ./.built-revision)
          echo "pin=${PIN} built=${BUILT}"
          case "${BUILT}" in
            ${PIN}*) echo "revision pin verified" ;;
            *) echo "revision mismatch"; exit 1 ;;
          esac
      - name: Run BoringSSL interop + DTLS 1.3 self matrix (fail if harness missing)
        env:
          CI: true
          WERIFT_REQUIRE_BORINGSSL: "1"
          WERIFT_BORINGSSL_ENFORCE_PIN: "1"
        run: |
          cd packages/dtls
          npm run type
          npx vitest run ./tests/e2e/boringssl ./tests/e2e/self13.test.ts ./tests/e2e/self13_matrix.test.ts ./tests/e2e/self13_loss.test.ts