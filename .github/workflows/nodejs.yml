name: Node CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - "feature/*"
      - "maintain/*"
      - "shinyoshiaki/*"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v7.0.1
      - name: init submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get -y install libavdevice-dev libavfilter-dev libopus-dev libvpx-dev pkg-config libsrtp2-dev libasound2-dev libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-pulseaudio ffmpeg
          npm i
          cd e2e
          npm i
          cd ../
          npm run install:browsers
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      - name: test
        env:
          CI: true
        run: |
          npm run ci
      - name: Node.js TypeScript resolve hook test
        run: npm run test:node-ts
      - name: RTP browser smoke test
        run: npm run test:browser --workspace packages/rtp
      - name: examples e2e
        env:
          CI: true
        run: |
          npm run examples:e2e

  # Firefox interop regressions (e.g. an NSS-only DTLS rejection) do not show
  # in the Chrome suite, so the Firefox E2E suite runs in its own job, in
  # parallel with `build`. It stays out of `npm run ci` / `npm run e2e` /
  # `e2e/run-ci.js` so local default validation does not get longer.
  firefox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The harness's private Playwright cache (e2e/browsers-path.js).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/e2e/node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7.0.1
      - name: init submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.x
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get -y install libavdevice-dev libavfilter-dev libopus-dev libvpx-dev pkg-config libsrtp2-dev libasound2-dev libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-pulseaudio ffmpeg
          npm i
          cd e2e
          npm install --prefer-offline --no-audit --no-fund --no-update-notifier
      - name: install Playwright Firefox
        working-directory: e2e
        # e2e's own playwright, so the revision matches what vitest launches;
        # --with-deps adds Firefox's system libraries.
        run: npx playwright install --with-deps firefox
      - name: Firefox E2E
        working-directory: e2e
        env:
          CI: true
          # `runner` is not available in job-level `env`, only in steps.
          FIREFOX_RECORDS_DIR: ${{ runner.temp }}/firefox-runs
        run: npm run firefox:ci
      - name: upload Firefox run record and failure screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: firefox-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/firefox-runs/
            e2e/.vitest/attachments/
          if-no-files-found: warn

  mediasoup-interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: init submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install mediasoup build deps
        run: sudo apt-get update && sudo apt-get install -y python3 python3-pip ninja-build build-essential
      - name: Install werift workspace dependencies
        run: npm ci
      - name: mediasoup interop fixture
        working-directory: integration/werift-mediasoup-interop
        run: |
          npm ci
          npm run type
          npm run test:small
          npm run test:interop
          npm run install:browsers
          npm run test:browser

  dtls13-boringssl:
    name: DTLS 1.3 BoringSSL interop (P0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.x
      - name: Install deps
        run: npm i
      - name: Fetch pinned BoringSSL + build dtls13_echo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ git pkg-config
          cd packages/dtls/tests/e2e/boringssl
          chmod +x ./fetch-and-build-boringssl.sh ./build-bssl-echo.sh
          # Always build from BORINGSSL_REVISION pin (reproducible; no preinstalled lib dependency)
          ./fetch-and-build-boringssl.sh
          test -x ./dtls13_echo
          test -f ./.built-revision
          PIN=$(tr -d '[:space:]' < ../../../tools/boringssl-dtls13/BORINGSSL_REVISION)
          BUILT=$(tr -d '[:space:]' < ./.built-revision)
          echo "pin=${PIN} built=${BUILT}"
          case "${BUILT}" in
            ${PIN}*) echo "revision pin verified" ;;
            *) echo "revision mismatch"; exit 1 ;;
          esac
      - name: Run BoringSSL interop + DTLS 1.3 self matrix (fail if harness missing)
        env:
          CI: true
          WERIFT_REQUIRE_BORINGSSL: "1"
          WERIFT_BORINGSSL_ENFORCE_PIN: "1"
        run: |
          cd packages/dtls
          npm run type
          npx vitest run ./tests/e2e/boringssl ./tests/e2e/self13.test.ts ./tests/e2e/self13_matrix.test.ts ./tests/e2e/self13_loss.test.ts
